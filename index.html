  <style>
    html,body{margin:0;min-height:100%;background:#080d13;color:#dce8f2;font:15px system-ui,sans-serif}
    main{max-width:600px;margin:15vh auto;padding:2rem;line-height:1.6}
    a{color:#65dcb9}code{overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main id="status" role="status" aria-live="polite">
    <h1>OSCP+ Preparation</h1>
    <p>Loading the original OSCP+ ULTIMATE checklist, phases, and machine notes…</p>
    <p><small>Original project: <a href="https://github.com/drgoteee/drgoteee.github.io">drgoteee/drgoteee.github.io</a> (MIT License).</small></p>
  </main>
  <script>
    (async function () {
      const upstream = 'https://raw.githubusercontent.com/drgoteee/drgoteee.github.io/main/index.html';
      try {
        const response = await fetch(upstream, {cache: 'no-cache'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();
        if (!/<html[\s>]/i.test(html)) throw new Error('Unexpected source response');
        // Keep original relative assets resolving to their original upstream location.
        html = html.replace(/<head([^>]*)>/i,
          '<head$1><base href="https://drgoteee.github.io/">');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('status').innerHTML =
          '<h1>Unable to load OSCP+ ULTIMATE</h1>' +
          '<p>This one-file edition requires an internet connection to fetch the ' +
          'original checklist. <a href="https://drgoteee.github.io/">Open the original website</a> ' +
          'or <a href="https://github.com/drgoteee/drgoteee.github.io">download the source repository</a> ' +
          'to host an independent offline copy.</p>';
      }
    })();
  </script>
</body>
